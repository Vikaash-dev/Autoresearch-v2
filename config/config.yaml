# BFTS and agent configuration for Autoresearch-v2
# Mirrors SakanaAI/AI-Scientist v2 bfts_config.yaml, extended with
# self-evolution and Theory of Mind parameters.

# ─── Tree Search ──────────────────────────────────────────────────────── #
bfts:
  num_workers: 4           # parallel expansion workers
  num_seeds: 3             # independent root nodes (Stage 1 drafts)
  max_nodes: 50            # hard cap on total nodes
  max_depth: 8             # tree depth before forcing writeup
  exploration_weight: 1.41 # UCB exploration constant
  prune_threshold: 0.0     # prune nodes below this metric
  debug_prob: 0.5          # probability of debug vs prune on failure
  max_debug_depth: 3       # max retries per failing node
  stages:
    stage1_max_iters: 20
    stage2_max_iters: 12
    stage3_max_iters: 12
    stage4_max_iters: 18

# ─── Core Loop ───────────────────────────────────────────────────────── #
loop:
  max_iterations: 50
  time_budget_seconds: 3600   # 1 hour
  min_improvement_delta: 0.001
  patience: 10
  debug_on_fail: true
  max_debug_depth: 3
  debug_prob: 0.5

# ─── Experiment Execution ────────────────────────────────────────────── #
exec:
  timeout: 300              # 5 minutes per experiment (karpathy: 5 min budget)
  work_dir: "workspaces"

# ─── LLM Models ──────────────────────────────────────────────────────── #
models:
  experiment:
    provider: "openai"
    model: "gpt-4o"         # Fast model for code generation
    temperature: 1.0
    max_tokens: 12000
  hypothesis:
    provider: "openai"
    model: "gpt-4o"
    temperature: 0.9
  writeup:
    provider: "openai"
    model: "o1-preview-2024-09-12"   # Powerful model for writing
    temperature: 1.0
  review:
    provider: "anthropic"
    model: "claude-opus-4"           # Different family from writer = honest review
    temperature: 0.5
  evolution:
    provider: "openai"
    model: "gpt-5"                   # Reflection-capable model for GEPA
    temperature: 0.9
  literature:
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.3

# ─── Theory of Mind ──────────────────────────────────────────────────── #
tom:
  persist_path: "memory/tom_state.json"
  reviewer_venue: "NeurIPS"
  enable_community_tom: true
  enable_self_tom: true
  self_analysis_interval: 10   # analyze self every N iterations

# ─── GEPA Self-Evolution ─────────────────────────────────────────────── #
gepa:
  max_generations: 20
  population_size: 8
  max_metric_calls: 150
  mutation_temperature: 0.9
  pareto_selection: true
  min_improvement_delta: 0.01
  max_artifact_chars: 15000
  require_tests_pass: true
  semantic_preservation: true
  # Phase targets (hermes-agent-self-evolution phases)
  phase1_skills: true      # Evolve skill text files (SKILL.md)
  phase2_tools: true       # Evolve tool descriptions (Tool-ToM metadata)
  phase3_prompts: true     # Evolve agent system prompts
  phase4_code: true        # Evolve tool implementation code snippets

# ─── Memory / Persistence ────────────────────────────────────────────── #
memory:
  blackboard_path: "memory/blackboard.json"
  skill_store_path: "memory/skills/"
  trajectory_log_path: "memory/trajectories/"
  cross_run_memory: true   # carry blackboard state across runs

# ─── Tavily Search ───────────────────────────────────────────────────── #
# Primary search backend for papers AND GitHub repos.
# Multi-key pool with automatic rotation on quota exhaustion / rate limits.
#
# Keys are read from environment variables (preferred) OR this list.
# Environment variables take priority:
#   TAVILY_API_KEY          — primary key
#   TAVILY_API_KEY_2        — second key  (auto-rotated when key 1 is exhausted)
#   TAVILY_API_KEY_3        — third key   (…and so on, up to TAVILY_API_KEY_20)
#
# To add keys only in config (not env), list them below:
tavily:
  api_keys: []            # e.g. ["tvly-key1", "tvly-key2"]
  search_depth: "advanced"
  papers_domains:
    - arxiv.org
    - semanticscholar.org
    - paperswithcode.com
    - openreview.net
    - proceedings.mlr.press
    - proceedings.neurips.cc
  github_domains:
    - github.com
  year_from: 2024         # filter papers to 2024+ by default
  max_papers: 20
  max_github_repos: 10

# ─── HyperAgent (FSoft-AI4Code/HyperAgent) ───────────────────────────── #
# 4-sub-agent pipeline (Planner → Navigator → Code Editor → Executor)
# used by ExperimentAgent for repo-level hypothesis evaluation.
# Requires: pip install hyperagent  (and Zoekt + Go for full functionality)
# Falls back to a bash-only mini-SWE-agent-inspired executor if not installed.
hyperagent:
  mode: "auto"              # "auto" | "patch" | "predict" | "bash"
  language: "python"        # "python" | "java"
  clone_dir: "workspaces/repos"
  nav_model: "claude-3-haiku-20240307"    # Navigator sub-agent (fast, cheap)
  edit_model: "claude-3-5-sonnet-20240620" # Code Editor sub-agent
  plan_model: "gpt-4o"                    # Planner sub-agent
  exec_timeout: 300
  api_key_env: "ANTHROPIC_API_KEY"

# ─── HyperOptimizer (Meta HyperAgents meta-optimization) ─────────────── #
# Meta-level optimizer that evolves optimizer strategies themselves.
# Sits above GEPA and selects / evolves the best optimization recipe
# (GEPA / TextGrad / AFlow / MIPRO / EvoPrompt or a novel hybrid) for each
# task type.  Inspired by: ai.meta.com/research/publications/hyperagents/
# and AgentAugi (tymines/AgentAugi) HyperAgents module.
hyper_optimizer:
  population_size: 6           # number of optimizer strategies in population
  max_generations: 30          # upper bound on meta-evolution generations
  evolve_every_n_runs: 5       # trigger meta-evolution after this many runs
  persist_path: "memory/hyper_optimizer_state.json"
  rng_seed: null               # set to int for reproducible experiments

# ─── GitHub Explorer ("start from existing work") ─────────────────────── #
# Discovers, ranks, and shallow-clones the best GitHub repos as starting
# points for hypothesis implementation — implementing the core design
# principle: "use existing work as a starting point, not a blank slate".
tools:
  github_explorer:
    top_k: 3                   # repos to deeply analyse per search
    min_stars: 50              # minimum star count to consider
    prefer_language: "python"
    clone_dir: "workspaces/github_explorer"
    github_token_env: "GITHUB_TOKEN"   # optional PAT for higher rate limits

# ─── Output ──────────────────────────────────────────────────────────── #
output:
  base_dir: "experiments"
  writeup_type: "icbinb"   # icbinb (4-page) | icml (8-page)
  generate_pdf: true
  save_tree_viz: true
