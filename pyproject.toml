[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-v2"
version = "2.0.0"
description = "AutoResearch v2: Self-Evolving Multi-Agent Autonomous Research Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "toml>=0.10",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
autoresearch = "autoresearch.cli.main:cli"

[tool.setuptools.packages.find]
include = ["autoresearch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
